name: Daily Morning Brief

on:
  schedule:
    # GitHub's free cron is unreliable (delays of 5min to 9+ hours observed).
    # We fire 9 times spread across the GST overnight window so at least one
    # actually lands in time for the morning commute. The pipeline checks if
    # today's episode already exists and exits cheaply if so, making every
    # later run that day a free no-op.
    - cron: "0 20 * * *"   # 00:00 GST
    - cron: "30 20 * * *"  # 00:30 GST
    - cron: "0 21 * * *"   # 01:00 GST
    - cron: "30 21 * * *"  # 01:30 GST
    - cron: "0 22 * * *"   # 02:00 GST
    - cron: "0 23 * * *"   # 03:00 GST
    - cron: "0 0 * * *"    # 04:00 GST
    - cron: "0 1 * * *"    # 05:00 GST
    - cron: "30 1 * * *"   # 05:30 GST (final fallback)
  workflow_dispatch:  # manual trigger button in the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ffmpeg (needed by pydub)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Configure git author
        run: |
          git config user.name "morning-brief-bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Run the daily pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python src/run_daily.py
